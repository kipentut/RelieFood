<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-bg">

<div class="app-container">

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <a href="/index" class="logo-link">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
                <span class="logo-text">RelieFood</span>
            </a>
        </div>
        <div class="menu" onclick="toggleMenu()">☰
            <div class="dropdown" id="dropdownMenu">
                <a href="/index">Home</a>
                <a href="/generate">Generate</a>
                <a href="/infographic">Infographics</a>
                <a href="/storage">Storage Tips</a>
                <a href="/portion">Portion Calculator</a>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TAB HEADER -->
        <div class="tab-header">
            <button class="tab active">Sign In</button>
            <a href="/signup">
                <button class="tab">Sign Up</button>
            </a>
        </div>

        <!-- FORM CARD -->
        <div class="form-card">

            <!-- LOGO ICON -->
            <div class="form-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="form-logo-img">
            </div>

            <!-- TITLE -->
            <h2 class="center">Welcome Back</h2>

            <p class="center subtitle">
                Continue your sustainable cooking journey
            </p>

            <!-- PASSWORD -->
            <form method="POST" action="/signin">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>

                <p class="forgot"><a href="/forgot-password">Forgot Password?</a></p>

                <button type="submit" class="primary-btn">Sign In</button>
            </form>

        </div>

    </div>

</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("dropdownMenu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

window.onclick = function(event) {
    if (!event.target.closest('.menu')) {
        document.getElementById("dropdownMenu").style.display = "none";
    }
}
</script>

</body>
</html>
