<!DOCTYPE html>
<html>
<head>
    <title>Generate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-bg">

<div class="app-container">

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">
            <a href="/index" class="logo-link">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img">
                <span class="logo-text">RelieFood</span>
            </a>
        </div>
        <div class="menu" onclick="toggleMenu()">☰
            <div class="dropdown" id="dropdownMenu">
                <a href="/index">Home</a>
                <a href="/generate">Generate</a>
                <a href="/infographic">Infographics</a>
                <a href="/storage">Storage Tips</a>
                <a href="/portion">Portion Calculator</a>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <div class="tag center">AI-Powered Recipe Generator</div>

        <h2 class="center">What’s In Your Kitchen?</h2>

        <p class="center">
            Enter your ingredients and let our AI create delicious recipes.
        </p>

        <!-- INPUT CARD -->
        <div class="form-card">

            <h3>Add Your Ingredients</h3>

            <div class="input-row">
                <input type="text" id="ingredients" placeholder="e.g., rice, chicken">
                <button class="add-btn">+</button>
            </div>

            <button class="primary-btn" onclick="generateRecipes()">
                Generate Recipes
            </button>

            <button class="gradient" onclick="randomRecipe()">
                Random Recipe Inspiration
            </button>

        </div>

        <!-- OUTPUT CARD -->
        <div class="output-card">
            <div id="output">
                <div class="no-recipe">
                    🍳
                    <p>No recipes yet</p>
                    <span>Add ingredients and click “Generate Recipes”.</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let ingredientsReady = false;

/* MENU */
function toggleMenu() {
    const menu = document.getElementById("dropdownMenu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

window.onclick = function(event) {
    if (!event.target.closest('.menu')) {
        document.getElementById("dropdownMenu").style.display = "none";
    }
}

/* ADD BUTTON */
document.querySelector(".add-btn").addEventListener("click", function() {
    const input = document.getElementById("ingredients").value.trim();

    if (!input) {
        alert("Please enter ingredients first.");
        return;
    }

    ingredientsReady = true;

    document.getElementById("output").innerHTML = `
        <p><b>Ingredients added:</b> ${input}</p>
    `;
});

/* GENERATE */
async function generateRecipes() {
    if (!ingredientsReady) {
        alert("Click the + button first.");
        return;
    }

    const ingredients = document.getElementById("ingredients").value;

    const res = await fetch("/generate_recipe", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ ingredients })
    });

    const data = await res.json();

    if (!data.length) {
        document.getElementById("output").innerHTML =
            "<p>No matching recipes found.</p>";
        return;
    }

    let html = "<p><b>Select a Recipe:</b></p>";

    data.forEach(item => {
        html += `
            <div class="recipe-title" onclick="loadRecipe('${item.title}')">
                ${item.title}
            </div>
        `;
    });

    document.getElementById("output").innerHTML = html;
}

/* LOAD RECIPE */
async function loadRecipe(title) {
    const res = await fetch("/recipe_details", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ title })
    });

    const recipe = await res.json();

    let html = `
        <h3>${recipe.title}</h3>
        <p><b>Ingredients:</b></p>
        <ul>
    `;

    recipe.ingredients.forEach(item => {
        html += `<li>${item}</li>`;
    });

    html += "</ul><p><b>Instructions:</b></p><ol>";

    recipe.steps.forEach(step => {
        html += `<li>${step}</li>`;
    });

    html += "</ol>";

    document.getElementById("output").innerHTML = html;
}

/* RANDOM RECIPE */
async function randomRecipe() {
    if (!ingredientsReady) {
        alert("Click the + button first.");
        return;
    }

    const res = await fetch("/random_recipe");
    const recipe = await res.json();

    let html = `
        <h3>${recipe.title}</h3>
        <p><b>Ingredients:</b></p>
        <ul>
    `;

    recipe.ingredients.forEach(item => {
        html += `<li>${item}</li>`;
    });

    html += "</ul><p><b>Instructions:</b></p><ol>";

    recipe.steps.forEach(step => {
        html += `<li>${step}</li>`;
    });

    html += "</ol>";

    document.getElementById("output").innerHTML = html;
}

/* PORTION CALCULATOR */
async function calculatePortion() {
    const age = document.getElementById("age").value;
    const sex = document.getElementById("sex").value;
    const height = document.getElementById("height").value;
    const weight = document.getElementById("weight").value;

    const res = await fetch("/calculate_portion", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ age, sex, height, weight })
    });

    const data = await res.json();

    document.getElementById("portionOutput").innerHTML = `
        <p><b>Estimated Calories:</b> ${data.calories} kcal/day</p>
        <p><b>Recommended Portion:</b> ${data.portion} servings</p>
    `;
}
</script>

</body>
</html>
