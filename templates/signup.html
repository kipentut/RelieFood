<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="page-bg">

<div class="app-container">

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TAB HEADER -->
        <div class="tab-header">
            <a href="/signin_page">
                <button class="tab">Sign In</button>
            </a>
            <button class="tab active">Sign Up</button>
        </div>

        <!-- FORM CARD -->
        <div class="form-card">

            <!-- LOGO ICON -->
            <div class="form-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="form-logo-img">
            </div>

            <!-- TITLE -->
            <h2 class="center">Create Account</h2>

            <p class="center subtitle">
                Join RelieFood and start your sustainable cooking journey
            </p>

            <!-- SIGNUP FORM -->
            <form method="POST" action="/signup">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm your password" required>

                <button type="submit" class="primary-btn">Sign Up</button>
            </form>

            <p class="center switch-form">
                Already have an account? <a href="/signin_page">Sign In</a>
            </p>

        </div>

    </div>

</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("dropdownMenu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

window.onclick = function(event) {
    if (!event.target.closest('.menu')) {
        document.getElementById("dropdownMenu").style.display = "none";
    }
}
</script>

</body>
</html>
